<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Logos Carousel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .carousel-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .carousel-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .carousel-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .carousel-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
        }

        .carousel-wrapper {
            overflow: hidden;
            position: relative;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 0;
        }

        .carousel-track {
            display: flex;
            animation: scroll 20s linear infinite;
            gap: 60px;
            align-items: center;
        }

        .logo-item {
            flex-shrink: 0;
            width: 200px;
            height: 100px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .logo-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .logo-item:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .logo-item:hover::before {
            left: 100%;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            text-align: center;
            z-index: 1;
            position: relative;
        }

        /* Duplicate the logos for seamless loop */
        .carousel-track {
            width: calc(200px * 16 + 60px * 15); /* 8 logos * 2 + gaps */
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-200px * 8 - 60px * 7)); /* Move by width of 8 logos + gaps */
            }
        }

        .carousel-wrapper:hover .carousel-track {
            animation-play-state: paused;
        }

        /* Gradient overlays for smooth edges */
        .carousel-wrapper::before,
        .carousel-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            width: 100px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .carousel-wrapper::before {
            left: 0;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.05), transparent);
        }

        .carousel-wrapper::after {
            right: 0;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.05), transparent);
        }

        @media (max-width: 768px) {
            .carousel-title {
                font-size: 2rem;
            }
            
            .logo-item {
                width: 150px;
                height: 80px;
            }
            
            .logo-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-header">
            <h1 class="carousel-title">Our Trusted Partners</h1>
            <p class="carousel-subtitle">Working together to deliver excellence</p>
        </div>
        
        <div class="carousel-wrapper">
            <div class="carousel-track">
                <!-- First set of logos -->
                <div class="logo-item">
                    <div class="logo-text">TechCorp</div>
                </div>
                <div class="logo-item">

                </div>
                <div class="logo-item">

                </div>
                <div class="logo-item">

                </div>
                <div class="logo-item">

                </div>
                <div class="logo-item">
                    <div class="logo-text">NextGen</div>
                </div>
                <div class="logo-item">
                    <div class="logo-text">SmartSolutions</div>
                </div>
                <div class="logo-item">

                </div>
                
                <!-- Duplicate set for seamless loop -->

                </div>
                <div class="logo-item">

                <div class="logo-item">

                </div>
                <div class="logo-item">

                </div>
                <div class="logo-item">
                    <div class="logo-text">DigitalEdge</div>
                </div>
                <div class="logo-item">
                    <div class="logo-text">NextGen</div>
                </div>
                <div class="logo-item">
                    <div class="logo-text">SmartSolutions</div>
                </div>
                <div class="logo-item">
                    <div class="logo-text">FutureTech</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

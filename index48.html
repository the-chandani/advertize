<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Journey</title>
  <!-- Bootstrap CSS properly loaded -->
  <!-- <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css" rel="stylesheet"> -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      overflow-x: hidden;
    }

    .section {
      font-size: 5rem;
    }
    .section--start {
      width: 100vw;
    }

    .center-marker {
      position: fixed;
      width: 2px;
      height: 100vh;
      background: tomato;
      top: 0;
      left: calc(50vw - 1px);
    }

    section {
      font-weight: 900;
      transition: color 0.3s;
    }

    section.active {
      color: orange;
    }

    .character, .character2 {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
      pointer-events: none;
    }

    .character-container {
      position: relative;
      top: 22.6%;
      margin-left: 8%;
      width: 35vh;
      height: 35vh;
    }

    .farola {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 33.16%;
      z-index: 9999999999;
    }

    .bikeomatic {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 53.028%;
      z-index: 9999999999;
    }

    .adman {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 85.37%;
      z-index: 9999999999;
    }

    .totoro {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 13.39%;
    }

    .trash {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 20.66%;
    }

    .clouds {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 19.97%;
      z-index: -1;
    }

    .advert {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 25.87%;
    }

    .chicapelo {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 28.36%;
    }

    .smellyoyster {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 31.74%;
    }

    /* Add some height to enable scrolling */
    .spacer {
      height: 200vh;
    }
  </style>
</head>
<body>

 <div class="wrapper d-flex flex-nowrap">
    <section id="route" class="section section--story section--small vh-100 flex-shrink-0 d-flex justify-content-center align-items-center">
      <div class="clouds">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/clouds.png" class="d-block h-100" />
      </div>
      <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/bg.png" class="d-block h-100" />
      <div class="totoro">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/totoro-ojos.gif" class="d-block h-100" />
      </div>
      <div class="trash">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/trash.gif" class="d-block h-100" />
      </div>
      <div class="chicapelo">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/chica_pelo.gif" class="d-block h-100" />
      </div>
      <div class="smellyoyster">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/smellyoyster.png" class="d-block h-100" />
      </div>
      <div class="advert">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/addd.png" class="d-block h-100" />
      </div>
      <div class="character">
        <div class="character-container">
          <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/car.png" class="d-block h-100" />
        </div>
      </div>
      <div class="farola">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/farola.png" class="d-block h-100" />
      </div>
      <div class="bikeomatic">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/bikeomatic.png" class="d-block h-100" />
      </div>
      <div class="adman">
        <img src="https://enekodev.s3.eu-west-3.amazonaws.com/img/adman.png" class="d-block h-100" />
      </div>
    </section>
  </div>

  <!-- Add spacer to enable scrolling -->
  <div class="spacer"></div>

  <!-- GSAP CDN - Load only once -->
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script> -->
  <script src="https://unpkg.com/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/gsap@3.13.0/dist/gsap.min.js"></script>


  <script>
    gsap.registerPlugin(ScrollTrigger);

    const sections = gsap.utils.toArray("section");
    const character = gsap.utils.toArray(".character");
    let maxWidth = 0;

    const getMaxWidth = () => {
      maxWidth = 0;
      sections.forEach((section) => {
        maxWidth += section.offsetWidth;
      });
    };
    
    getMaxWidth();
    ScrollTrigger.addEventListener("refreshInit", getMaxWidth);

    // Main horizontal scroll animation
    gsap.to(sections, {
      x: () => `-${maxWidth - window.innerWidth}`,
      ease: "none",
      scrollTrigger: {
        trigger: ".wrapper",
        pin: true,
        scrub: true,
        end: () => `+=${maxWidth}`,
        invalidateOnRefresh: true
      }
    });

    // Character movement (opposite direction for parallax effect)
    gsap.to(character, {
    //   x: () => `${maxWidth * 0.3}`, // Reduced movement for better effect
     x: () => `${maxWidth - window.innerWidth}`,
      ease: "none",
      scrollTrigger: {
        trigger: ".wrapper",
        scrub: true,
        end: () => `+=${maxWidth}`,
        invalidateOnRefresh: true
      }
    });
  </script>
</body>
</html>
